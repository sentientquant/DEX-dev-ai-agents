[mypy]
# Mypy Type Checking Configuration
# Catches type errors at compile time instead of runtime

# Python version
python_version = 3.11

# Import discovery
mypy_path = trading_modes,risk_management,src
namespace_packages = True
explicit_package_bases = True

# Strictness levels - start moderate, increase over time
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# None and Optional handling
no_implicit_optional = True
strict_optional = True

# Error output
show_error_codes = True
show_error_context = True
pretty = True
color_output = True

# Incremental type checking (faster)
incremental = True
cache_dir = .mypy_cache

# Coverage reports
html_report = mypy_report
any_exprs_report = mypy_report

# Per-module settings

[mypy-trading_modes.models.*]
# Our typed models - enforce strict checking
disallow_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_reexport = True

[mypy-trading_modes.indicators.*]
# Technical indicators - enforce strict checking
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-trading_modes.core.signal_verification_agent]
# Migrated modules - strict checking
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-risk_management.trading_database_typed]
# Typed database wrapper - moderate checking
# Interfaces with legacy database so can't be fully strict
check_untyped_defs = True
warn_return_any = False

# Third-party libraries without stubs - ignore for now
[mypy-pandas_ta.*]
ignore_missing_imports = True

[mypy-termcolor.*]
ignore_missing_imports = True

[mypy-ccxt.*]
ignore_missing_imports = True

[mypy-binance.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-google.generativeai.*]
ignore_missing_imports = True

# Legacy modules - gradually add type hints
[mypy-src.*]
ignore_errors = True

[mypy-risk_management.trading_database]
# Legacy database - wrapped by trading_database_typed
# Don't type check this - we're replacing it with typed wrapper
ignore_errors = True

[mypy-trading_modes.02_STRATEGY_BASED_TRADING.*]
ignore_errors = True

[mypy-trading_modes.03_COPYBOT_TRADING.*]
ignore_errors = True

[mypy-trading_modes.04_RBI_RESEARCH_TRADING.*]
ignore_errors = True
